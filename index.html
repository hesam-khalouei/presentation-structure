<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      پرزنتیشن جامع راهکارهای سازمانی و اعتباری اوانو | Ewano B2B Interactive
      Deck
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/slides.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- SVG Sprite Definitions -->
    <svg class="svg-sprite" aria-hidden="true">
      <defs>
        <!-- نمادهای کامل SVG -->
      </defs>
    </svg>

    <!-- پس‌زمینه پویا -->
    <div class="ambient-canvas">
      <div class="ambient-grid"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- هدر پرزنتیشن -->
    <header class="deck-header">
      <!-- برند، ناوبری فصول و اکشن‌ها -->
    </header>

    <!-- استیج اسلایدها (تمام ۲۱ اسلاید به صورت مستقیم در DOM) -->
    <main class="stage-container" id="stageContainer">
      <!-- اسلاید ۱ (دارای کلاس active) -->
      <section
        class="slide active"
        data-chapter="0"
        data-title="صفحه عنوان: راهکارهای سازمانی و اعتباری اوانو">
        ...
      </section>

      <!-- اسلاید ۲ تا ۲۱ -->
      <section
        class="slide"
        data-chapter="0"
        data-title="اکوسیستم همراه اول و شرکت‌های کلیدی">
        ...
      </section>
      ...
      <section
        class="slide"
        data-chapter="4"
        data-title="گزارش آماری اوانو، سازمان‌های همکار و جمع‌بندی چرا اوانو؟">
        ...
      </section>
    </main>

    <!-- منوی کشویی فهرست (Drawer) -->
    <div
      class="drawer-backdrop"
      id="drawerBackdrop"
      onclick="if (event.target === this) toggleDrawer();">
      <div class="drawer-panel">
        <div id="drawerList" class="flex-col flex-gap-8"></div>
      </div>
    </div>

    <!-- فوتر ناوبری -->
    <footer class="deck-footer">
      <!-- کنترل‌ها، دکمه‌های قبلی/بعدی، نقاط و شمارنده -->
    </footer>

    <!-- اسکریپت‌ها (بدون slides-loader.js) -->
    <script src="js/navigation.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
